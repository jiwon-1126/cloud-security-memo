version: '3.8'
services:
  web:
    image: nginx:1.28-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    networks: [frontend_network]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
  was:
    image: ${WAS_IMAGE:?set WAS_IMAGE to registry image tag}
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: memo
      DB_USER: memo
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    secrets:
      - source: DB_PASSWORD
        target: DB_PASSWORD
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: JWT_SECRET
        target: JWT_SECRET
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: CSRF_SECRET
        target: CSRF_SECRET
        uid: '10001'
        gid: '10001'
        mode: 0400
      - source: TEST_USER_PASSWORD
        target: TEST_USER_PASSWORD
        uid: '10001'
        gid: '10001'
        mode: 0400
    networks: [frontend_network, backend_network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 240s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        monitor: 300s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: memo
      MARIADB_USER: memo
      MARIADB_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PASSWORD
    secrets: [DB_PASSWORD, DB_ROOT_PASSWORD]
    volumes: ["db_data:/var/lib/mysql"]
    networks: [backend_network]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.memo_db == true]
      restart_policy:
        condition: any
networks:
  frontend_network:
    driver: overlay
  backend_network:
    driver: overlay
    internal: true
volumes:
  db_data:
    name: memo-prod-data
configs:
  nginx_config:
    file: ./nginx/nginx.conf
secrets:
  DB_PASSWORD:
    external: true
  DB_ROOT_PASSWORD:
    external: true
  JWT_SECRET:
    external: true
  CSRF_SECRET:
    external: true
  TEST_USER_PASSWORD:
    external: true
