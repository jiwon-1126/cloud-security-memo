name: Test and publish for automatic deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memo-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: memo
          MARIADB_USER: memo
          MARIADB_PASSWORD: ci-db-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      RUN_DB_TESTS: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: memo
      DB_USER: memo
      DB_PASSWORD: ci-db-only
      TEST_USER_PASSWORD: 'test1234!'
      PUBLIC_ORIGIN: http://localhost:5000
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run real MariaDB tests
        run: |
          export JWT_SECRET=$(openssl rand -hex 32)
          export CSRF_SECRET=$(openssl rand -hex 32)
          python -m pytest -v -rs
  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            jiwoninnuk/cloud-security-memo:${{ github.sha }}
            jiwoninnuk/cloud-security-memo:main-ready
