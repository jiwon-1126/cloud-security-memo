services:
  web:
    image: nginx:1.28-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [frontend_network]
    depends_on:
      was:
        condition: service_healthy
    restart: unless-stopped
  was:
    build: .
    image: cloud-security-memo:local
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: memo
      DB_USER: memo
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?set TEST_USER_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks: [frontend_network, backend_network]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 240s
    restart: unless-stopped
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: memo
      MARIADB_USER: memo
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes: ["db_data:/var/lib/mysql"]
    networks: [backend_network]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
    internal: true
volumes:
  db_data:
    external: true
    name: ${DB_VOLUME_NAME:-memo-dev-data}
